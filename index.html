
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cita Huellas</title>
<style>
body{background:#101827;color:white;font-family:Arial;padding:18px}
.card{background:#202e42;padding:20px;border-radius:16px;margin-top:20px}
h1{color:#54d6ad}
select,button{width:100%;padding:14px;margin-top:14px;border-radius:9px;font-size:16px}
button{background:#16a982;color:white;border:0;font-weight:bold}
p{line-height:1.8;color:#cbd5e1}
</style>
</head>
<body>
<h1> CITA HUELLAS </h1>
<p>مساعد مواعيد البصمات في إسبانيا</p>
<div class="card">
<h3>اختيار المدينة</h3>
<select id="city">
<option value="Logroño">Logroño</option>
<option value="Barcelona">Barcelona</option>
</select>
<h3>نوع الموعد</h3>
<select id="type">
<option>TOMA DE HUELLA (EXPEDICIÓN DE TARJETA)</option>
</select>
<button onclick="save()">حفظ الاختيارات</button>
<button onclick="openSite()">فتح موقع المواعيد الرسمي</button>
<p id="status">لم يتم بدء المراقبة</p>
</div>
<script>
const city=document.getElementById('city');
const type=document.getElementById('type');
const status=document.getElementById('status');
city.value=localStorage.getItem('city')||'Logroño';
function save(){
 localStorage.setItem('city',city.value);
 localStorage.setItem('type',type.value);
 status.textContent='تم حفظ المدينة: '+city.value;
}
function openSite(){
 window.open('https://sede.administracionespublicas.gob.es/pagina/index/directorio/icpplus','_blank');
}
</script>
</body>
</html>
